<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文トレーニング Week1 Day4</title>
<style>
  :root {
    --q-color: #2563eb;
    --a-color: #16a34a;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  }
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 20px 20px;
  }
  .hidden { display: none !important; }

  .progress-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .block-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(37,99,235,0.18);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    z-index: 5;
  }

  .card {
    width: min(90vw, 820px);
    min-height: 40vh;
    border-radius: 24px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s ease;
  }
  .card.question { box-shadow: 0 0 0 6px var(--q-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.answer   { box-shadow: 0 0 0 6px var(--a-color), 0 20px 60px rgba(0,0,0,0.35); }

  .card-text {
    width: 100%;
    min-width: 0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card.question .card-text { color: var(--q-color); }
  .card.answer .card-text { color: var(--a-color); }

  .bar-wrap {
    width: min(90vw, 820px);
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: var(--q-color);
    border-radius: 6px;
    transform-origin: left;
  }
  .bar.answer-bar { background: var(--a-color); }

  .timer-num {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .start-title {
    font-size: 30px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 12px;
    text-align: center;
  }
  .start-sub {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.8;
  }
  button.big-btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #16a34a);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
  }
  button.big-btn:active { transform: scale(0.97); }

  .btn-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.ghost-btn {
    display: inline-block;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.25);
    color: #e2e8f0;
    text-decoration: none;
  }

  .done-title {
    font-size: 34px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <div class="progress-top" id="progressTop"></div>
  <div class="block-badge hidden" id="blockBadge"></div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="start-title">瞬間英作文トレーニング</div>
    <div class="start-sub">Week1 Day4　全10問 × 5周　問題7秒 → 解答5秒 で自動的に進みます</div>
    <div class="btn-row">
      <button class="big-btn" id="startBtn">スタート</button>
      <a class="ghost-btn" href="week1-home.html">Week1 一覧に戻る</a>
    </div>
  </div>

  <!-- Play screen -->
  <div class="screen hidden" id="playScreen">
    <div class="card question" id="card">
      <div class="card-text" id="cardText"></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="timer-num" id="timerNum"></div>
  </div>

  <!-- Done screen -->
  <div class="screen hidden" id="doneScreen">
    <div class="done-title">お疲れさまでした！</div>
    <div class="start-sub">10問 × 5周が終了しました</div>
    <div class="btn-row">
      <button class="big-btn" id="restartBtn">もう一度</button>
      <a class="ghost-btn" href="week1-home.html">Week1 一覧に戻る</a>
    </div>
  </div>

<script>
const DATA = [
  {
    "jp": "私は週末はだいたい9時ごろに起きます。",
    "en": "I usually wake up at around nine a.m. on weekends."
  },
  {
    "jp": "起きたあと、朝ごはんを食べてYouTubeを見ます。",
    "en": "After I get up, I eat breakfast and watch some videos on YouTube."
  },
  {
    "jp": "そのあと、買い物に行ったり友達とカフェで会ったりします。",
    "en": "Then I sometimes go shopping or meet my friends at a café."
  },
  {
    "jp": "午後は家で英語を勉強したり本を読んだりします。",
    "en": "In the afternoon, I often study English or read a book at home."
  },
  {
    "jp": "天気が良ければ公園を散歩します。",
    "en": "If the weather is nice, I go for a walk in the park."
  },
  {
    "jp": "それはリラックスできるからです。",
    "en": "Because it makes me feel relaxed."
  },
  {
    "jp": "夜は家族と一緒に夕食を食べます。",
    "en": "In the evening, I have dinner with my family."
  },
  {
    "jp": "映画を見ることもあります。",
    "en": "We sometimes watch a movie."
  },
  {
    "jp": "寝る前に来週の予定を確認します。",
    "en": "Before I go to bed, I check my schedule for the next week."
  },
  {
    "jp": "音楽を聴いてから寝ます。",
    "en": "I listen to music before I go to sleep."
  }
];

const ROUNDS = 5;
const Q_SEC = 7;
const A_SEC = 5;

let round = 1;
let qIdx = 0;
let phase = "question";
let timerInterval = null;
let remaining = 0;

const startScreen = document.getElementById("startScreen");
const playScreen = document.getElementById("playScreen");
const doneScreen = document.getElementById("doneScreen");
const card = document.getElementById("card");
const cardText = document.getElementById("cardText");
const bar = document.getElementById("bar");
const timerNum = document.getElementById("timerNum");
const progressTop = document.getElementById("progressTop");
const blockBadge = document.getElementById("blockBadge");

function startSession() {
  round = 1;
  qIdx = 0;
  startScreen.classList.add("hidden");
  doneScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  blockBadge.classList.remove("hidden");
  showQuestion();
}

function updateTopProgress() {
  progressTop.textContent = `${round}周目 / ${ROUNDS}周　${qIdx + 1} / ${DATA.length}問`;
  blockBadge.textContent = `Week1 Day4`;
}

function showQuestion() {
  phase = "question";
  updateTopProgress();
  const item = DATA[qIdx];
  card.classList.remove("answer");
  card.classList.add("question");
  cardText.textContent = item.jp;
  bar.classList.remove("answer-bar");
  runTimer(Q_SEC, showAnswer);
}

function showAnswer() {
  phase = "answer";
  const item = DATA[qIdx];
  card.classList.remove("question");
  card.classList.add("answer");
  cardText.textContent = item.en;
  bar.classList.add("answer-bar");
  runTimer(A_SEC, nextItem);
}

function nextItem() {
  qIdx++;
  if (qIdx < DATA.length) {
    showQuestion();
    return;
  }
  qIdx = 0;
  round++;
  if (round > ROUNDS) {
    finishSession();
    return;
  }
  showQuestion();
}

function finishSession() {
  clearInterval(timerInterval);
  playScreen.classList.add("hidden");
  doneScreen.classList.remove("hidden");
  progressTop.textContent = "";
  blockBadge.classList.add("hidden");
}

function runTimer(seconds, onComplete) {
  clearInterval(timerInterval);
  remaining = seconds;
  timerNum.textContent = remaining;

  bar.style.transition = "none";
  bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = "0%";

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      onComplete();
    } else {
      timerNum.textContent = remaining;
    }
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startSession);
document.getElementById("restartBtn").addEventListener("click", startSession);
</script>
</body>
</html>
