<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文チェック Week1 確認テスト</title>
<style>
  :root {
    --q-color: #2563eb;
    --a-color: #16a34a;
    --rec-color: #dc2626;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  }
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .hidden { display: none !important; }

  .progress-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }
  .progress-top .rec-tag {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 12px;
    border-radius: 999px;
    background: var(--rec-color);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 2px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .card {
    width: min(90vw, 820px);
    min-height: 40vh;
    border-radius: 24px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s ease;
  }
  .card.question { box-shadow: 0 0 0 6px var(--q-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.answer   { box-shadow: 0 0 0 6px var(--a-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.recording.question { box-shadow: 0 0 0 6px var(--rec-color), 0 0 40px rgba(220,38,38,0.55); }
  .card.recording.answer   { box-shadow: 0 0 0 6px var(--rec-color), 0 0 40px rgba(220,38,38,0.55); }

  .rec-badge {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--rec-color);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    animation: pulse 1.2s infinite;
  }
  .rec-badge .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }

  .card-text {
    width: 100%;
    min-width: 0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card.question .card-text { color: var(--q-color); }
  .card.answer .card-text { color: var(--a-color); }
  .card.recording .card-text { color: var(--rec-color); }

  .bar-wrap {
    width: min(90vw, 820px);
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar { height: 100%; width: 100%; background: var(--q-color); border-radius: 6px; transform-origin: left; }
  .bar.answer-bar { background: var(--a-color); }
  .bar.rec-bar { background: var(--rec-color); }

  .timer-num {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .start-title {
    font-size: 30px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 12px;
    text-align: center;
  }
  .start-sub {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.8;
  }
  .rec-notice {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(220,38,38,0.12);
    border: 2px solid var(--rec-color);
    color: #fecaca;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 22px;
    border-radius: 14px;
    margin-bottom: 28px;
    max-width: min(90vw, 560px);
    text-align: left;
    line-height: 1.6;
  }
  .rec-notice .dot {
    flex-shrink: 0;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--rec-color);
    animation: pulse 1.2s infinite;
  }

  button.big-btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #16a34a);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
  }
  button.big-btn:active { transform: scale(0.97); }

  .done-title {
    font-size: 34px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 24px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="progress-top" id="progressTop"></div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="start-title">瞬間英作文チェック</div>
    <div class="start-sub" id="startSub"></div>
    <div class="rec-notice">
      <span class="dot"></span>
      <span>課題を解いている様子を録画（もしくは録音）してください。録画（録音）を開始してから「スタート」を押してください。</span>
    </div>
    <button class="big-btn" id="startBtn">スタート</button>
  </div>

  <!-- Play screen -->
  <div class="screen hidden" id="playScreen">
    <div class="rec-badge" id="recBadge"><span class="dot"></span>REC</div>
    <div class="card question recording" id="card">
      <div class="card-text" id="cardText"></div>
    </div>
    <div class="bar-wrap"><div class="bar rec-bar" id="bar"></div></div>
    <div class="timer-num" id="timerNum"></div>
  </div>

  <!-- Done screen -->
  <div class="screen hidden" id="doneScreen">
    <div class="done-title">お疲れさまでした！</div>
    <div class="start-sub">全10問が終了しました。<br>録画（録音）を停止して、Slackに提出してください。</div>
  </div>

<script>
// ===== Week1 確認テスト Part2（毎週ここだけ差し替える）=====
const TITLE = "Week1 確認テスト";
const DATA = [
  {jp:"私は毎朝シャワーを浴びます。"},
  {jp:"彼女はよくピアノを弾きます。"},
  {jp:"私たちはめったに外食しません。"},
  {jp:"彼は毎晩日記を書きます。"},
  {jp:"私は朝食を食べたあと、歯を磨きます。"},
  {jp:"彼女は忙しいですが、いつも笑顔です。"},
  {jp:"疲れていたので、私は早く寝ました。"},
  {jp:"私は宿題をする前に、部屋を掃除します。"},
  {jp:"彼はテレビを見ながら、夕食を食べます。"},
  {jp:"私は毎週日曜日に、家族と教会に行きます。"}
];
const Q_SEC = 7;   // 日本語を表示している時間（この間に英語を言う）
// ============================================================

let qIndex = 0;
let timerInterval = null;
let remaining = 0;

const startScreen = document.getElementById("startScreen");
const playScreen = document.getElementById("playScreen");
const doneScreen = document.getElementById("doneScreen");
const cardText = document.getElementById("cardText");
const bar = document.getElementById("bar");
const timerNum = document.getElementById("timerNum");
const progressTop = document.getElementById("progressTop");

document.getElementById("startSub").innerHTML =
  `${TITLE} Part2　全${DATA.length}問を1周<br>日本語が出たら、${Q_SEC}秒以内に英語を声に出して言ってください。<br>自動で次の問題に進みます。途中で止めずに最後まで通して行ってください。`;

function startSession() {
  qIndex = 0;
  startScreen.classList.add("hidden");
  doneScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  progressTop.innerHTML = `${qIndex + 1} / ${DATA.length}問<span class="rec-tag">REC</span>`;
  cardText.textContent = DATA[qIndex].jp;
  runTimer(Q_SEC, nextItem);
}

function nextItem() {
  qIndex++;
  if (qIndex < DATA.length) {
    showQuestion();
  } else {
    finishSession();
  }
}

function finishSession() {
  clearInterval(timerInterval);
  playScreen.classList.add("hidden");
  doneScreen.classList.remove("hidden");
  progressTop.textContent = "";
}

function runTimer(seconds, onComplete) {
  clearInterval(timerInterval);
  remaining = seconds;
  timerNum.textContent = remaining;

  bar.style.transition = "none";
  bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = "0%";

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      onComplete();
    } else {
      timerNum.textContent = remaining;
    }
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startSession);
</script>
</body>
</html>
