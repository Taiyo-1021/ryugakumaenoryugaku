<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文 5日間プログラム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div class="home-wrap">
      <div class="home-title">瞬間英作文 5日間プログラム</div>
      <div class="home-sub">
        1日20問ずつ、前日までの問題に積み上げながら学習します。<br>
        仮定法・関係代名詞・受動態・現在完了/過去完了を均等配分した構成です。<br>
        各日、問題は7秒→回答例は5秒で自動的に進みます。
      </div>
      <div class="day-list">
        <a class="day-card" href="day1.html">
          <span class="day-name">Day 1</span>
          <span class="day-count">20問</span>
          <span class="day-arrow">→</span>
        </a>
        <a class="day-card" href="day2.html">
          <span class="day-name">Day 2</span>
          <span class="day-count">40問（累計）</span>
          <span class="day-arrow">→</span>
        </a>
        <a class="day-card" href="day3.html">
          <span class="day-name">Day 3</span>
          <span class="day-count">60問（累計）</span>
          <span class="day-arrow">→</span>
        </a>
        <a class="day-card" href="day4.html">
          <span class="day-name">Day 4</span>
          <span class="day-count">80問（累計）</span>
          <span class="day-arrow">→</span>
        </a>
        <a class="day-card" href="day5.html">
          <span class="day-name">Day 5</span>
          <span class="day-count">100問（累計）</span>
          <span class="day-arrow">→</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
