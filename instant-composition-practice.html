<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文トレーニング</title>
<style>
  :root {
    --q-color: #2563eb;
    --a-color: #16a34a;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  }
  .screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .hidden { display: none !important; }

  .progress-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .card {
    width: min(90vw, 820px);
    min-height: 40vh;
    border-radius: 24px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s ease;
  }
  .card.question { box-shadow: 0 0 0 6px var(--q-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.answer   { box-shadow: 0 0 0 6px var(--a-color), 0 20px 60px rgba(0,0,0,0.35); }

  .card-text {
    width: 100%;
    min-width: 0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card.question .card-text { color: var(--q-color); }
  .card.answer .card-text { color: var(--a-color); }

  .bar-wrap {
    width: min(90vw, 820px);
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: var(--q-color);
    border-radius: 6px;
    transform-origin: left;
  }
  .bar.answer-bar { background: var(--a-color); }

  .timer-num {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .start-title {
    font-size: 30px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 12px;
    text-align: center;
  }
  .start-sub {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 36px;
    text-align: center;
    line-height: 1.8;
  }
  button.big-btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #16a34a);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
  }
  button.big-btn:active { transform: scale(0.97); }

  .done-title {
    font-size: 34px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <div class="progress-top" id="progressTop"></div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="start-title">瞬間英作文トレーニング</div>
    <div class="start-sub">全100問 ランダム出題<br>問題 7秒 → 回答例 5秒 で自動的に進みます</div>
    <button class="big-btn" id="startBtn">スタート</button>
  </div>

  <!-- Play screen -->
  <div class="screen hidden" id="playScreen">
    <div class="card question" id="card">
      <div class="card-text" id="cardText"></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="timer-num" id="timerNum"></div>
  </div>

  <!-- Done screen -->
  <div class="screen hidden" id="doneScreen">
    <div class="done-title">お疲れさまでした！</div>
    <div class="start-sub">100問終了しました</div>
    <button class="big-btn" id="restartBtn">もう一度</button>
  </div>

  // ---- 疑問文 (5) ----

  {jp:"なぜ彼女は怒っているのですか。", en:"Why is she angry?"},
  {jp:"会議は何時に始まりますか。", en:"What time does the meeting start?"},
  {jp:"駅までどうやって行けばいいですか。", en:"How do I get to the station?"}

const QUESTION_SEC = 7;
const ANSWER_SEC = 5;

let order = [];
let idx = 0;
let phase = "question"; // or "answer"
let timerInterval = null;
let remaining = 0;

const startScreen = document.getElementById("startScreen");
const playScreen = document.getElementById("playScreen");
const doneScreen = document.getElementById("doneScreen");
const card = document.getElementById("card");
const cardText = document.getElementById("cardText");
const bar = document.getElementById("bar");
const timerNum = document.getElementById("timerNum");
const progressTop = document.getElementById("progressTop");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSession() {
  order = shuffle(DATA.map((_, i) => i));
  idx = 0;
  startScreen.classList.add("hidden");
  doneScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  showQuestion();
}

function updateTopProgress() {
  progressTop.textContent = `${idx + 1} / ${DATA.length}`;
}

function showQuestion() {
  phase = "question";
  updateTopProgress();
  const item = DATA[order[idx]];
  card.classList.remove("answer");
  card.classList.add("question");
  cardText.textContent = item.jp;
  bar.classList.remove("answer-bar");
  runTimer(QUESTION_SEC, showAnswer);
}

function showAnswer() {
  phase = "answer";
  const item = DATA[order[idx]];
  card.classList.remove("question");
  card.classList.add("answer");
  cardText.textContent = item.en;
  bar.classList.add("answer-bar");
  runTimer(ANSWER_SEC, nextItem);
}

function nextItem() {
  idx++;
  if (idx >= order.length) {
    finishSession();
    return;
  }
  showQuestion();
}

function finishSession() {
  clearInterval(timerInterval);
  playScreen.classList.add("hidden");
  doneScreen.classList.remove("hidden");
  progressTop.textContent = "";
}

function runTimer(seconds, onComplete) {
  clearInterval(timerInterval);
  remaining = seconds;
  timerNum.textContent = remaining;

  // reset bar instantly to full width, then animate down
  bar.style.transition = "none";
  bar.style.width = "100%";
  // force reflow
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = "0%";

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      onComplete();
    } else {
      timerNum.textContent = remaining;
    }
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startSession);
document.getElementById("restartBtn").addEventListener("click", startSession);
</script>
</body>
</html>
