<style>
  :root{
    --pink:#cc007e; --pink-light:#ff66c4; --pink-bg:#fff0f8;
    --gray:#6b7280; --bg:#f6f4f5; --card:#ffffff; --text:#1f2937;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,"Segoe UI",Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header{background:var(--card);border-radius:16px;padding:20px 20px 16px;
    border-top:6px solid var(--pink);box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .week{color:var(--pink);font-weight:800;letter-spacing:2px;font-size:14px;}
  h1{margin:4px 0 12px;font-size:22px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{flex:1 1 0;min-width:56px;border:2px solid var(--pink);background:#fff;color:var(--pink);
    border-radius:10px;padding:8px 4px;font-size:15px;font-weight:800;cursor:pointer;}
  .tab.active{background:var(--pink);color:#fff;}
  .theme{color:var(--gray);font-size:14px;margin-bottom:12px;}
  .howto{background:var(--pink-bg);border-radius:10px;padding:12px 14px;font-size:14px;}
  .howto ol{margin:4px 0 0;padding-left:20px;}
  .q{background:var(--card);border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .q-head{background:var(--pink);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-weight:700;}
  .q-num{background:rgba(255,255,255,.25);border-radius:6px;padding:0 8px;font-size:14px;flex-shrink:0;}
  .q-a{font-size:16px;word-break:break-word;}
  .q-body{padding:12px 16px 14px;}
  .b-jp{font-size:16px;margin-bottom:8px;}
  .b-label{color:var(--gray);font-size:13px;overflow:hidden;white-space:nowrap;}
</style>

    </div>
  </header>

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keys = Object.keys(DAYS);

  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = 'Day' + d; b.dataset.day = d;
  b.onclick = () => { location.hash = 'day' + d; };
  tabs.appendChild(b);
});
function show(d){
  if (!DAYS[d]) d = keys[0];
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.day === d));
  document.getElementById('theme').textContent = 'Day' + d + ' の文法：' + DAYS[d].theme;
  document.title = 'Week3 Day' + d + ' 確認問題プラス';
  document.getElementById('list').innerHTML = DAYS[d].qs.map((q, i) => `
    <div class="q">
      <div class="q-head"><span class="q-num">Q${i+1}</span><span class="q-a">A: "${esc(q.a)}"</span></div>
      <div class="q-body">
        <div class="b-jp">B: 「${esc(q.b)}」</div>
        <div class="b-label">B (English)：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
      </div>
    </div>`).join('');
  window.scrollTo(0, 0);
}
function fromHash(){ show((location.hash.match(/day(\d+)/) || [])[1]); }
