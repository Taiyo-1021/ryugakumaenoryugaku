<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文トレーニング Week12</title>
<style>
  :root {
    --q-color: #2563eb;
    --a-color: #16a34a;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  }
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 20px 20px;
  }
  .hidden { display: none !important; }

  .progress-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .block-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(37,99,235,0.18);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    z-index: 5;
  }

  .card {
    width: min(90vw, 820px);
    min-height: 40vh;
    border-radius: 24px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s ease;
  }
  .card.question { box-shadow: 0 0 0 6px var(--q-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.answer   { box-shadow: 0 0 0 6px var(--a-color), 0 20px 60px rgba(0,0,0,0.35); }

  .card-text {
    width: 100%;
    min-width: 0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card.question .card-text { color: var(--q-color); }
  .card.answer .card-text { color: var(--a-color); }

  .bar-wrap {
    width: min(90vw, 820px);
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: var(--q-color);
    border-radius: 6px;
    transform-origin: left;
  }
  .bar.answer-bar { background: var(--a-color); }

  .timer-num {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .start-title {
    font-size: 30px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 12px;
    text-align: center;
  }
  .start-sub {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 36px;
    text-align: center;
    line-height: 1.8;
  }
  button.big-btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #16a34a);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
  }
  button.big-btn:active { transform: scale(0.97); }

  .done-title {
    font-size: 34px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <div class="progress-top" id="progressTop"></div>
  <div class="block-badge hidden" id="blockBadge"></div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="start-title">瞬間英作文トレーニング</div>
    <div class="start-sub">Week12 総復習　全50問　問題7秒 → 解答5秒 で自動的に進みます</div>
    <button class="big-btn" id="startBtn">スタート</button>
  </div>

  <!-- Play screen -->
  <div class="screen hidden" id="playScreen">
    <div class="card question" id="card">
      <div class="card-text" id="cardText"></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="timer-num" id="timerNum"></div>
  </div>

  <!-- Done screen -->
  <div class="screen hidden" id="doneScreen">
    <div class="done-title">お疲れさまでした！</div>
    <div class="start-sub">全50問終了しました</div>
    <button class="big-btn" id="restartBtn">もう一度</button>
  </div>

<script>
const BLOCK_EMOJI = ["1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣"];

const DATA = [
  // ===== 1️⃣ =====
  {block:1, jp:"私は、留学はすべての人に必要だとは思いません。", en:"I do not think studying abroad is necessary for everyone."},
  {block:1, jp:"留学は、自分の「普通」という考えを壊すことがあります。", en:"Studying abroad can break your idea of \"normal.\""},
  {block:1, jp:"学生は、自分の文化を背負っていたことに気づくかもしれません。", en:"Students may realize that they have been carrying their own culture."},
  {block:1, jp:"たとえば、沈黙や目を合わせることが最初は戸惑うことがあります。", en:"For example, silence and eye contact can feel confusing at first."},
  {block:1, jp:"新しい環境に適応しなければならないので、人はより慎重になれます。", en:"Since they have to adapt to a new environment, people can become more careful."},
  {block:1, jp:"国内でも十分学べると主張する人もいます。", en:"Some people argue that students can learn enough in their own country."},
  {block:1, jp:"留学はお金がかかるので、全員にとって現実的とは限りません。", en:"Studying abroad can be expensive, so it may not be realistic for everyone."},
  {block:1, jp:"海外で暮らすことは、学生に自分自身を問い直させるかもしれません。", en:"Living abroad could push students to question themselves."},
  {block:1, jp:"あなたは、留学はすべての人に必要だと思いますか？", en:"Do you think studying abroad is necessary for everyone?"},
  {block:1, jp:"大切なのは、自分の考え方だけが唯一の正解ではないと気づくことです。", en:"What matters is realizing that your own way of thinking is not the only one."},

  // ===== 2️⃣ =====
  {block:2, jp:"明確なルールがない限り、スマホは子どもに良いとは思いません。", en:"I do not think smartphones are good for children unless there are clear rules."},
  {block:2, jp:"多くの子どもはたいてい、動画を見るためにスマホを使います。", en:"Many children usually use smartphones to watch videos."},
  {block:2, jp:"子どもはよく、いちばん楽な娯楽を選びます。", en:"Children often choose the easiest kind of entertainment."},
  {block:2, jp:"もし学習のために使うなら、スマホは従来の道具より役に立つことがあります。", en:"If they use smartphones for learning, they can be more useful than traditional tools."},
  {block:2, jp:"子どもはスマホで情報をすばやく調べることができます。", en:"Children can search for information quickly with smartphones."},
  {block:2, jp:"もしスマホを使いすぎたら、ゆっくり考える習慣を失うかもしれません。", en:"If they use smartphones too much, they may lose the habit of thinking slowly."},
  {block:2, jp:"それは多くの親が思っているより有害です。", en:"That is more harmful than many parents expect."},
  {block:2, jp:"一部のアプリは、本や実際の会話ほど役に立つとは限りません。", en:"Some apps are not always as helpful as books or real conversations."},
  {block:2, jp:"もしあなたが親なら、子どもにスマホの制限を設けますか？", en:"If you were a parent, would you set limits on your child's smartphone use?"},
  {block:2, jp:"子どもはスマホを賢く使う方法を学ぶべきだと思いますか？", en:"Do you think children should learn how to use smartphones wisely?"},

  // ===== 3️⃣ =====
  {block:3, jp:"AIが教師を完全に置き換えることはできないと思います。", en:"I do not think AI can completely replace teachers."},
  {block:3, jp:"生徒を一人ひとり理解する教師は大切です。", en:"Teachers who understand students as individuals are important."},
  {block:3, jp:"すぐにフィードバックを返すAIツールは役に立つことがあります。", en:"AI tools that give quick feedback can be useful."},
  {block:3, jp:"生徒は自分のペースで勉強できます。", en:"Students can study at their own pace."},
  {block:3, jp:"AIがうまく使われている学校では、教師は生徒と話す時間を増やせるかもしれません。", en:"In schools where AI is used well, teachers may spend more time talking with students."},
  {block:3, jp:"教育は、正しい答えを与えることだけではありません。", en:"Education is not just about giving correct answers."},
  {block:3, jp:"同じ間違いを繰り返す生徒もいます。", en:"Some students keep making the same mistake."},
  {block:3, jp:"そのような支えは、教師によって与えられることが多いです。", en:"That kind of support is often given by teachers."},
  {block:3, jp:"AIは教育でどのように使われるべきだと思いますか？", en:"How do you think AI should be used in education?"},
  {block:3, jp:"AIは教師を支えるべきであり、置き換えるべきではないと思います。", en:"I think AI should support teachers, not replace them."},

  // ===== 4️⃣ =====
  {block:4, jp:"よりよい社会は、見過ごされがちな人に気づくことから始まると思います。", en:"I think a better society starts with noticing people who are often overlooked."},
  {block:4, jp:"今日、多くの人が自由や成功について話しています。", en:"Today, many people talk about freedom and success."},
  {block:4, jp:"しかし、まだ取り残されている人もいます。", en:"However, some people are still left behind."},
  {block:4, jp:"昔は、地域のつながりが今より強かったです。", en:"In the past, local communities were more closely connected."},
  {block:4, jp:"社会は大きく変化してきました。", en:"Society has changed a lot."},
  {block:4, jp:"私たちは、技術や教育の面で大きな進歩を見てきました。", en:"We have seen great progress in technology and education."},
  {block:4, jp:"しかし、便利さは孤独や不平等を解決していません。", en:"However, convenience has not solved loneliness or inequality."},
  {block:4, jp:"すべての人が教育を受ける機会を持つべきです。", en:"Everyone should have access to education."},
  {block:4, jp:"よりよい社会をつくるために、何が必要だと思いますか？", en:"What do you think we need to create a better society?"},
  {block:4, jp:"よりよい社会は、一人の偉大なリーダーによって作られると思いますか？", en:"Do you think a better society is made by one great leader?"},

  // ===== 5️⃣ =====
  {block:5, jp:"最近、私は自分の将来について真剣に考えています。", en:"I have been thinking about my future seriously recently."},
  {block:5, jp:"将来、私は紙の上で成功して見えるだけの人にはなりたくありません。", en:"In the future, I do not want to become someone who only looks successful on paper."},
  {block:5, jp:"正直で、役に立ち、少しわくわくする人生を築きたいです。", en:"I want to build a life that feels honest, useful, and a little exciting."},
  {block:5, jp:"まだ取り組むべきことがたくさんあります。", en:"There are still many things I need to work on."},
  {block:5, jp:"私は英語を伸ばし続けるべきです。", en:"I should keep improving my English."},
  {block:5, jp:"もし小さな一歩を積み重ね続ければ、弱さを強みに変えられるでしょう。", en:"If I keep taking small steps, I will be able to turn my weaknesses into strengths."},
  {block:5, jp:"もしさまざまな人が一緒に学ぶ場所で働けたら、視野を広げられるでしょう。", en:"If I could work in a place where different people learn together, I would broaden my horizons."},
  {block:5, jp:"もっと多くの人が、孤独を感じずに挑戦できる社会を作る必要があります。", en:"We must create a society where more people can challenge themselves without feeling alone."},
  {block:5, jp:"あなたの将来のビジョンは何ですか？", en:"What is your vision for the future?"},
  {block:5, jp:"私は、成長し続けて、他の人を支えたいです。", en:"I want to keep growing and support others."}
];

const Q_SEC = 7;
const A_SEC = 5;

let idx = 0;
let phase = "question";
let timerInterval = null;
let remaining = 0;

const startScreen = document.getElementById("startScreen");
const playScreen = document.getElementById("playScreen");
const doneScreen = document.getElementById("doneScreen");
const card = document.getElementById("card");
const cardText = document.getElementById("cardText");
const bar = document.getElementById("bar");
const timerNum = document.getElementById("timerNum");
const progressTop = document.getElementById("progressTop");
const blockBadge = document.getElementById("blockBadge");

function startSession() {
  idx = 0;
  startScreen.classList.add("hidden");
  doneScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  blockBadge.classList.remove("hidden");
  showQuestion();
}

function updateTopProgress() {
  progressTop.textContent = `${idx + 1} / ${DATA.length}`;
  const block = DATA[idx].block;
  blockBadge.textContent = `Week12 ${BLOCK_EMOJI[block - 1]}`;
}

function showQuestion() {
  phase = "question";
  updateTopProgress();
  const item = DATA[idx];
  card.classList.remove("answer");
  card.classList.add("question");
  cardText.textContent = item.jp;
  bar.classList.remove("answer-bar");
  runTimer(Q_SEC, showAnswer);
}

function showAnswer() {
  phase = "answer";
  const item = DATA[idx];
  card.classList.remove("question");
  card.classList.add("answer");
  cardText.textContent = item.en;
  bar.classList.add("answer-bar");
  runTimer(A_SEC, nextItem);
}

function nextItem() {
  idx++;
  if (idx >= DATA.length) {
    finishSession();
    return;
  }
  showQuestion();
}

function finishSession() {
  clearInterval(timerInterval);
  playScreen.classList.add("hidden");
  doneScreen.classList.remove("hidden");
  progressTop.textContent = "";
  blockBadge.classList.add("hidden");
}

function runTimer(seconds, onComplete) {
  clearInterval(timerInterval);
  remaining = seconds;
  timerNum.textContent = remaining;

  bar.style.transition = "none";
  bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = "0%";

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      onComplete();
    } else {
      timerNum.textContent = remaining;
    }
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startSession);
document.getElementById("restartBtn").addEventListener("click", startSession);
</script>
</body>
</html>
