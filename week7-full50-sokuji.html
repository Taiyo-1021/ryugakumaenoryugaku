<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間英作文トレーニング Week7</title>
<style>
  :root {
    --q-color: #2563eb;
    --a-color: #16a34a;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  }
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 20px 20px;
  }
  .hidden { display: none !important; }

  .progress-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .block-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(37,99,235,0.18);
    border: 1px solid rgba(96,165,250,0.4);
    color: #93c5fd;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    z-index: 5;
  }

  .card {
    width: min(90vw, 820px);
    min-height: 40vh;
    border-radius: 24px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s ease;
  }
  .card.question { box-shadow: 0 0 0 6px var(--q-color), 0 20px 60px rgba(0,0,0,0.35); }
  .card.answer   { box-shadow: 0 0 0 6px var(--a-color), 0 20px 60px rgba(0,0,0,0.35); }

  .card-text {
    width: 100%;
    min-width: 0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card.question .card-text { color: var(--q-color); }
  .card.answer .card-text { color: var(--a-color); }

  .bar-wrap {
    width: min(90vw, 820px);
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: var(--q-color);
    border-radius: 6px;
    transform-origin: left;
  }
  .bar.answer-bar { background: var(--a-color); }

  .timer-num {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
  }

  .start-title {
    font-size: 30px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 12px;
    text-align: center;
  }
  .start-sub {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 36px;
    text-align: center;
    line-height: 1.8;
  }
  button.big-btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #16a34a);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
  }
  button.big-btn:active { transform: scale(0.97); }

  .done-title {
    font-size: 34px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <div class="progress-top" id="progressTop"></div>
  <div class="block-badge hidden" id="blockBadge"></div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="start-title">瞬間英作文トレーニング</div>
    <div class="start-sub">Week7 総復習　全50問　問題7秒 → 解答5秒 で自動的に進みます</div>
    <button class="big-btn" id="startBtn">スタート</button>
  </div>

  <!-- Play screen -->
  <div class="screen hidden" id="playScreen">
    <div class="card question" id="card">
      <div class="card-text" id="cardText"></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="timer-num" id="timerNum"></div>
  </div>

  <!-- Done screen -->
  <div class="screen hidden" id="doneScreen">
    <div class="done-title">お疲れさまでした！</div>
    <div class="start-sub">全50問終了しました</div>
    <button class="big-btn" id="restartBtn">もう一度</button>
  </div>

<script>
const BLOCK_EMOJI = ["1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣"];

const DATA = [
  // ===== 1️⃣ (Day43) =====
  {block:1, jp:"あなたは今までに何か怖いことに挑戦したことがありますか？", en:"Have you ever tried something scary?"},
  {block:1, jp:"私はその映画を2回見たことがあります。", en:"I have watched that movie twice."},
  {block:1, jp:"私は虫を食べたことが一度もありません。", en:"I have never eaten insects."},
  {block:1, jp:"私は京都に3回行ったことがあります。", en:"I have been to Kyoto three times."},
  {block:1, jp:"彼女は空港へ行ってしまいました（今ここにいません）。", en:"She has gone to the airport."},
  {block:1, jp:"私は最近、新しい趣味を始めました。", en:"I have started a new hobby recently."},
  {block:1, jp:"私は以前より自信がつきました。", en:"I have become more confident."},
  {block:1, jp:"今のところ、コップを10個くらい作りました。", en:"I have made about ten cups so far."},
  {block:1, jp:"あなたは今までに外国へ行ったことがありますか？", en:"Have you ever been to another country?"},
  {block:1, jp:"挑戦することは成功することより大切だと学びました。", en:"I have learned that trying is more important than succeeding."},

  // ===== 2️⃣ (Day44) =====
  {block:2, jp:"私は京都に何度も行ったことがあります。", en:"I have been to Kyoto many times."},
  {block:2, jp:"私は先月そこへ行きました。", en:"I went there last month."},
  {block:2, jp:"あなたは以前その公園に行ったことがありますか？", en:"Have you been to that park before?"},
  {block:2, jp:"私は昨日彼に会いました。", en:"I saw him yesterday."},
  {block:2, jp:"私はもう彼に会いました。", en:"I have already seen him."},
  {block:2, jp:"彼女は以前日本に行ったことがありません。", en:"She hasn't been to Japan before."},
  {block:2, jp:"私は初めて一人でそこへ行きました。", en:"I went there alone for the first time."},
  {block:2, jp:"私はあの日を一度も忘れたことがありません。", en:"I have never forgotten that day."},
  {block:2, jp:"それ以来、ほかの街にもたくさん行きました。", en:"I have been to many other cities since then."},
  {block:2, jp:"そのお寺は長い間守られてきました。", en:"The temple has been protected for a long time."},

  // ===== 3️⃣ (Day45) =====
  {block:3, jp:"私は5年間日記をつけています。", en:"I have kept a journal for five years."},
  {block:3, jp:"彼女は4月から英語を勉強しています。", en:"She has studied English since April."},
  {block:3, jp:"あなたはどのくらいの期間ここに住んでいますか？", en:"How long have you lived here?"},
  {block:3, jp:"私はずっとこの曲が好きです。", en:"I have always loved this song."},
  {block:3, jp:"彼は生まれてからずっとここに住んでいます。", en:"He has lived here all his life."},
  {block:3, jp:"この仕事を始めて以来、私はこの方法を使っています。", en:"I have used this method since I started this job."},
  {block:3, jp:"私たちは卒業して以来、彼に会っていません。", en:"We haven't seen him since we graduated."},
  {block:3, jp:"私は高校生のころから毎晩書いています。", en:"I have written every night since I was in high school."},
  {block:3, jp:"私の字はそれ以来大きく変わりました。", en:"My handwriting has changed a lot since then."},
  {block:3, jp:"私はずっと京都に行きたいと思っています。", en:"I have always wanted to visit Kyoto."},

  // ===== 4️⃣ (Day46) =====
  {block:4, jp:"私はちょうど宿題を終えたところです。", en:"I have just finished my homework."},
  {block:4, jp:"彼女はもう家を出ました。", en:"She has already left home."},
  {block:4, jp:"あなたはもう宿題を終えましたか？", en:"Have you finished your homework yet?"},
  {block:4, jp:"私はまだ決めていません。", en:"I haven't decided yet."},
  {block:4, jp:"カギをなくしてしまいました。", en:"I have lost my key."},
  {block:4, jp:"私は2週間、朝スマホを見ていません。", en:"I haven't checked my phone in the morning for two weeks."},
  {block:4, jp:"私はもう違いに気づきました。", en:"I have already noticed a difference."},
  {block:4, jp:"彼女はまだ私のメッセージに返信していません。", en:"She hasn't replied to my message yet."},
  {block:4, jp:"今のところ、すべて順調です。", en:"So far, everything has gone well."},
  {block:4, jp:"この小さな変化がもう違いを生んでいます。", en:"This small change has already made a difference."},

  // ===== 5️⃣ (Day47) =====
  {block:5, jp:"私は6年間犬を飼っています。", en:"I have had a dog for six years."},
  {block:5, jp:"私は彼女を3つの公園に連れて行ったことがあります。", en:"I have taken her to three parks."},
  {block:5, jp:"彼女はもう少し白くなってきました。", en:"She has already turned a little gray."},
  {block:5, jp:"彼女は私が今までに会った中で一番頑固な犬です。", en:"She is the most stubborn dog I have ever met."},
  {block:5, jp:"私は彼女の小さないびきに慣れました。", en:"I have gotten used to her small snoring."},
  {block:5, jp:"私は彼女から忍耐を学びました。", en:"I have learned patience from her."},
  {block:5, jp:"彼女は一度も謝ったことがありません。", en:"She has never apologized."},
  {block:5, jp:"彼女は子犬のころから私のベッドの横で寝ています。", en:"She has slept next to my bed since she was a puppy."},
  {block:5, jp:"彼女はまだじっと座ることを覚えていません。", en:"She hasn't learned to sit still yet."},
  {block:5, jp:"あなたは今までにペットを飼ったことがありますか？", en:"Have you ever had a pet?"},
];

const Q_SEC = 7;
const A_SEC = 5;

let idx = 0;
let phase = "question";
let timerInterval = null;
let remaining = 0;

const startScreen = document.getElementById("startScreen");
const playScreen = document.getElementById("playScreen");
const doneScreen = document.getElementById("doneScreen");
const card = document.getElementById("card");
const cardText = document.getElementById("cardText");
const bar = document.getElementById("bar");
const timerNum = document.getElementById("timerNum");
const progressTop = document.getElementById("progressTop");
const blockBadge = document.getElementById("blockBadge");

function startSession() {
  idx = 0;
  startScreen.classList.add("hidden");
  doneScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  blockBadge.classList.remove("hidden");
  showQuestion();
}

function updateTopProgress() {
  progressTop.textContent = `${idx + 1} / ${DATA.length}`;
  const block = DATA[idx].block;
  blockBadge.textContent = `Week7 ${BLOCK_EMOJI[block - 1]}`;
}

function showQuestion() {
  phase = "question";
  updateTopProgress();
  const item = DATA[idx];
  card.classList.remove("answer");
  card.classList.add("question");
  cardText.textContent = item.jp;
  bar.classList.remove("answer-bar");
  runTimer(Q_SEC, showAnswer);
}

function showAnswer() {
  phase = "answer";
  const item = DATA[idx];
  card.classList.remove("question");
  card.classList.add("answer");
  cardText.textContent = item.en;
  bar.classList.add("answer-bar");
  runTimer(A_SEC, nextItem);
}

function nextItem() {
  idx++;
  if (idx >= DATA.length) {
    finishSession();
    return;
  }
  showQuestion();
}

function finishSession() {
  clearInterval(timerInterval);
  playScreen.classList.add("hidden");
  doneScreen.classList.remove("hidden");
  progressTop.textContent = "";
  blockBadge.classList.add("hidden");
}

function runTimer(seconds, onComplete) {
  clearInterval(timerInterval);
  remaining = seconds;
  timerNum.textContent = remaining;

  bar.style.transition = "none";
  bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = "0%";

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      onComplete();
    } else {
      timerNum.textContent = remaining;
    }
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startSession);
document.getElementById("restartBtn").addEventListener("click", startSession);
</script>
</body>
</html>
